name: SeaweedMat checks
on:
  push:
    paths:
      - 'app.py'
      - 'seaweedmat_engine.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/seaweedmat-ci.yml'
      - 'data/E02/**'
      - 'outputs/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py seaweedmat_engine.py
      - run: python -m pytest -q
